# Settings for `shf anisotropy <task>`, one section per task.
#   input:   table <input>.dat;  columns: 1-indexed (theta, phi, energy) columns
#   angles in degrees, energies in the table in eV, fitted energies in meV
# energies.dat and curve.dat in this template are synthetic (S = 2, D = -0.8 meV, E = -0.15 meV,
# eigenframe turned by 25 deg about z); replace them with your data.

spin: 4                      # spin quantum number used by the quantum models

average:                     # average E(n) and E(-n) -> <input>_average.dat
  input: energies
  columns: [1, 2, 3]         # e.g. [1, 2, 13] for site 1 of a 6-site energies.dat

change-frame:                # -> new_frame.dat
  input: energies_average
  columns: [1, 2, 3]
  z_direction: [90, 60]
  z_direction_from_data: 1   # 0: use z_direction; 1: direction of E_min; 2: direction of E_max

mae:
  input: energies_average
  columns: [1, 2, 3]

plot:                        # -> <input>.pdf
  input: energies
  columns: [1, 2, 3]
  title: ""
  factor: 1.0                # energy scale factor, e.g. for equivalent spins rotated together
  wavenumber: true           # cm^-1 (true) or meV (false)

# Bounds are [min, max]; a single number fixes the parameter. p0 gives start values (default:
# the middle of the bounds). The eigenframe is the DFT frame rotated by the extrinsic zyz Euler
# angles (alpha, beta, gamma): its z axis points along (theta, phi) = (beta, gamma), and alpha turns
# x and y about it. Optional: frame: 3x3 rows = axes of the frame the angles are written in.

fit-DE:                      # E = D Sz^2 + E (Sx^2 - Sy^2) + E0
  input: energies_average
  columns: [1, 2, 3]
  title: FePc
  model: quantum             # quantum or classical
  select: 1                  # 1: only theta = 0, 90, 180; 0: all directions
  factor: 1.0
  bounds: {D: [-2.0, -0.05], E: [-0.5, -0.001], E0: [-10.0, 10.0], alpha: [0, 180], beta: [0, 0.001], gamma: 0}
  p0: {D: -1.025, E: -0.2505, E0: -10.0, alpha: 60, beta: 0}

fit-D-tensor:                # E = S^T D S + E0, general symmetric D
  input: energies_average
  columns: [1, 2, 3]
  title: Pair1 of Mn8
  bounds: {Dxx: [-2, 2], Dyy: [-2, 2], Dzz: [-2, 2], Dxy: [-2, 2], Dxz: [-2, 2], Dyz: [-2, 2], E0: [-10, 10]}
  p0: {E0: -10}

fit-curve:                   # E = a (theta - b)^2 + c along one cut; columns: angle, energy
  input: curve               # e.g. in-plane-low with columns [2, 7]
  columns: [1, 2]
  title: ""
  bounds: {a: [-10, 10], b: [60, 150], c: [-5, 5]}
  p0: {a: 1, b: 100, c: 1}

fit-surface:                 # E = a theta'^2 + c, theta' from the axis (beta, gamma)
  input: energies
  columns: [1, 2, 3]
  title: CrFe2 SMM SCO
  bounds: {a: [0, 10], c: [-5, 5], beta: [-5, 5], gamma: [0, 360]}
  p0: {a: 1, c: 0, beta: 1, gamma: 45}
